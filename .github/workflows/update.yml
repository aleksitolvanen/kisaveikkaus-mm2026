name: Päivitä mm2026-data

# Hakee FIFA:n virallisen datan, rakentaa data.json:n ja committaa sen TÄHÄN repoon.
# Sivusto (erillinen repo) pollaa data.json:n rawsta ~60 s välein ilman reloadia.
#
# TÄRKEÄÄ: GitHubin schedule on best-effort — */5-cron laukesi käytännössä ~1×/h.
# Siksi cron vain KÄYNNISTÄÄ looppaavan työn (live-loop), joka itse hakee ja
# julkaisee ~2,5 min välein niin kauan kuin ottelu on käynnissä (tai alkamassa
# 90 min sisällä). Looppi päättyy ikkunan sulkeuduttua tai 5 h 30 min kohdalla;
# concurrency-jonossa odottava seuraava käynnistys jatkaa saumattomasti.
#
# Manuaaliset kentät (sikajengi, cup-jatkoonpääsijät, maalintekijämaalit)
# syötetään käsin data/mm2026/results.json:iin; looppi pull--rebasaa joka
# kierroksella, joten käsin pushatut muutokset eivät jää alle.

on:
  schedule:
    # Loop-käynnistimet 2×/h matsi-ikkunoiden aikana (kickoffit UTC 16-04).
    # Best-effort riittää: looppi kattaa kaiken kunhan yksi näistä laukeaa / ~4 h.
    - cron: "23,53 0-4,15-23 * * *"
    # Otteluohjelman päivätuoreutus hiljaisena tuntina (pois live-ikkunoista)
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live-loop / live / schedule / results / all"
        default: "live-loop"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Hae FIFA-data ja julkaise
        run: |
          MODE=live-loop
          # Päivätuoreutus ajaa all-moden: otteluohjelma + TULOSTEN täydennys
          # (catch-all jos jokin FT jäi live-ikkunoiden väliin)
          if [ "${{ github.event.schedule }}" = "17 9 * * *" ]; then MODE=all; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          echo "mode=$MODE"

          git config user.name "mm2026-data"
          git config user.email "noreply@github.com"

          publish() {
            git add -f data/mm2026/tournament.json data/mm2026/results.json data.json
            if ! git diff --quiet --cached; then
              git commit -m "Päivitä ($(date -u +%FT%H:%MZ))"
              git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main; return 1; }
              git push || git push
            else
              git reset >/dev/null
              echo "Ei muutoksia."
            fi
          }

          if [ "$MODE" != "live-loop" ]; then
            node tools/fetch-fifa.mjs mm2026 --mode="$MODE"
            node build-data.mjs mm2026
            publish
            exit 0
          fi

          # Gate: LIVE | WAIT <sek kickoffiin> | DONE
          gate() {
            node -e '
              const t = require("./data/mm2026/tournament.json");
              const W = 200*60e3, AHEAD = 120*60e3, now = Date.now();
              const ks = [...t.matches, ...(t.knockout||[])]
                .map(m => m.kickoff && Date.parse(m.kickoff)).filter(Boolean);
              if (ks.some(k => now >= k && now <= k + W)) { console.log("LIVE"); process.exit(0); }
              const fut = ks.filter(k => k > now);
              if (!fut.length) { console.log("DONE"); process.exit(0); }
              const next = Math.min(...fut);
              if (next - now <= AHEAD) console.log("WAIT " + Math.ceil((next - now)/1000));
              else console.log("DONE");'
          }

          DEADLINE=$(( SECONDS + 19800 ))   # 5 h 30 min < 6 h job-raja
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            # tuoreuta paikallinen tila (käsin syötetyt kentät eivät jää alle)
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main; }

            STATE=$(gate)
            case "$STATE" in
              DONE)
                # Selvityshaku ennen poistumista: finalisoi ikkunan reunalle
                # jääneet live-tulokset (fetch-fifa hoitaa; ei API-kutsua jos
                # jäänteitä ei ole)
                echo "Ei otteluita horisontissa – selvityshaku ja loppu."
                if node tools/fetch-fifa.mjs mm2026 --mode=live && node build-data.mjs mm2026; then
                  publish || true
                fi
                break ;;
              WAIT*) S=${STATE#WAIT }; S=$(( S < 300 ? S : 300 )); echo "Kickoffiin ${S}s – odotetaan"; sleep "$S"; continue ;;
            esac

            if node tools/fetch-fifa.mjs mm2026 --mode=live && node build-data.mjs mm2026; then
              publish || true
            fi
            sleep 150   # ~2,5 min sykli — kohtelias FIFA:lle
          done
